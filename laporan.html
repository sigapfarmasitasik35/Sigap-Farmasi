<style>
  :root{
    --bg:#0b0f10;
    --panel:#12181a;
    --panel-2:#161d1f;
    --border:#242c2e;
    --brand:#e8a33d;
    --brand-soft:#3a2e14;
    --green:#1fae76;
    --green-soft:#153627;
    --red:#e5484d;
    --red-soft:#3a1f21;
    --text:#f2f4f3;
    --text-dim:#93a1a0;
    --text-faint:#5c6b6a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
  }
  h1,h2,.brand{font-family:'Space Grotesk',sans-serif;}

  .sidebar{
    width:240px;flex-shrink:0;background:var(--panel);
    border-right:1px solid var(--border);padding:16px 12px;
    display:flex;flex-direction:column;gap:16px;
    height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;padding:0 6px;}
  .brand span{color:var(--brand);}
  .brand-icon{width:28px;height:28px;border-radius:7px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .menu-label{font-size:10px;letter-spacing:.08em;color:var(--text-faint);text-transform:uppercase;padding:0 10px;margin-bottom:5px;}
  nav ul{list-style:none;display:flex;flex-direction:column;gap:1px;}
  nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--text-dim);text-decoration:none;font-size:13px;font-weight:500;transition:background .15s, color .15s; white-space:nowrap;}
  nav a:hover{background:var(--panel-2);color:var(--text);}
  nav a.active{background:var(--brand-soft);color:var(--brand);}
  nav a svg{width:16px;height:16px;flex-shrink:0;}

  .main{
    flex:1;padding:14px 22px;min-width:0;
    height:100vh; display:flex; flex-direction:column; overflow:hidden; overflow-y:auto;
  }

  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-shrink:0;}
  .menu-toggle{
    display:none;width:34px;height:34px;flex-shrink:0;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);cursor:pointer;
  }
  .search-top{
    flex:1;display:flex;align-items:center;gap:9px;background:var(--panel);
    border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--text-faint);
    max-width:480px; min-width:0;
  }
  .search-top input{background:none;border:none;outline:none;color:var(--text);font-size:13.5px;width:100%;min-width:0;}
  .avatar{
    width:34px;height:34px;border-radius:9px;background:var(--brand);color:#241a06;font-weight:700;
    font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:auto;
  }
  .logout-btn{width:34px;height:34px;border-radius:9px;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-left:8px;}
  .logout-btn:hover{color:var(--red);border-color:var(--red);}

  .page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:14px;flex-shrink:0;}
  .page-header h1{font-size:20px;font-weight:700;margin-bottom:3px;}
  .page-header p{color:var(--text-dim);font-size:12.5px;}
  .page-header-actions{display:flex;gap:10px;}

  .btn-primary{display:flex;align-items:center;gap:7px;background:var(--brand);color:#241a06;border:none;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn-primary:hover{opacity:.9;}
  .btn-secondary{display:flex;align-items:center;gap:8px;background:var(--panel-2);color:var(--text);border:1px solid var(--border);padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-secondary:hover{border-color:var(--text-faint);}
  .btn-red{display:flex;align-items:center;gap:8px;background:var(--red);color:#fff;border:none;padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-red:hover{opacity:.9;}

  .filter-panel{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:16px;margin-bottom:16px;flex-shrink:0;
    display:flex; gap:24px; flex-wrap:wrap; align-items:flex-end;
  }
  .filter-group label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:8px;}
  .tab-group{display:flex;gap:6px;background:var(--panel-2);padding:4px;border-radius:9px;}
  .tab-btn{background:none;border:none;color:var(--text-dim);font-size:13px;font-weight:600;padding:7px 13px;border-radius:7px;cursor:pointer;white-space:nowrap;}
  .tab-btn.active{background:var(--green);color:#06231a;}
  .filter-group input[type="date"]{
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    padding:9px 11px;color:var(--text);font-size:13.5px;outline:none;color-scheme:dark;
  }
  .filter-group input[type="date"]:focus{border-color:var(--brand);}

  .table-wrap{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    overflow:auto; -webkit-overflow-scrolling:touch;
    flex:1; min-height:200px;
  }
  table{width:100%;min-width:760px;border-collapse:collapse;}
  thead th{
    text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);
    padding:8px 16px;border-bottom:1px solid var(--border); white-space:nowrap;
    position:sticky; top:0; background:var(--panel); z-index:1;
  }
  tbody td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--panel-2);}

  .status-pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .status-pill.ok{background:var(--green-soft);color:var(--green);}
  .status-pill.warn{background:var(--brand-soft);color:var(--brand);}
  .status-pill.bad{background:var(--red-soft);color:var(--red);}
  .status-pill.muted{background:var(--panel-2);color:var(--text-dim);}

  .empty-msg{color:var(--text-faint);font-size:13px;text-align:center;padding:32px 12px;white-space:normal;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--brand);color:#241a06;font-weight:600;font-size:14px;padding:12px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;z-index:60;max-width:360px;}
  .toast.error{background:var(--red);color:#fff;}

  @media (max-width:900px){
    .sidebar{display:none;}
    .main{padding:14px;}
    .menu-toggle{display:flex;}
  }
</style>

<script>
  const SUPABASE_URL = 'https://liaqekfxhbzewgctvach.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_e8fyvAqH8lwfxUAN03MRLQ_dCABlMId';

  let db;
  try {
    if (!window.supabase) throw new Error('Library Supabase gagal dimuat.');
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    console.error('Gagal membuat koneksi Supabase:', e);
  }

  const KONFIG = {
    kebutuhan: {
      judul: 'Kebutuhan Obat',
      table: 'kebutuhan_obat',
      kolomTanggal: 'tanggal_kebutuhan',
      kolom: [
        { key: 'tanggal_kebutuhan', label: 'Tanggal',    tipe: 'tanggal' },
        { key: 'bencana',           label: 'Bencana',     tipe: 'teks' },
        { key: 'obat',              label: 'Obat',        tipe: 'teks' },
        { key: 'jumlah_dibutuhkan', label: 'Dibutuhkan',  tipe: 'angka' },
        { key: 'jumlah_terpenuhi',  label: 'Terpenuhi',   tipe: 'angka' },
        { key: 'status',            label: 'Status',      tipe: 'status' }
      ]
    },
    distribusi: {
      judul: 'Distribusi Obat',
      table: 'distribusi_obat',
      kolomTanggal: 'tanggal_kirim',
      kolom: [
        { key: 'tanggal_kirim', label: 'Tanggal',     tipe: 'tanggal' },
        { key: 'obat',          label: 'Obat',         tipe: 'teks' },
        { key: 'tujuan',        label: 'Fasilitas Tujuan', tipe: 'teks' },
        { key: 'jumlah',        label: 'Jumlah',       tipe: 'angka' },
        { key: 'status',        label: 'Status',       tipe: 'status' }
      ]
    },
    stok: {
      judul: 'Stok & Inventori',
      table: 'data_obat',
      kolomTanggal: null,
      kolom: [
        { key: 'nama_obat',   label: 'Nama Obat',   tipe: 'teks' },
        { key: 'kategori',    label: 'Kategori',     tipe: 'teks' },
        { key: 'stok',        label: 'Stok',         tipe: 'angka' },
        { key: 'satuan',      label: 'Satuan',       tipe: 'teks' },
        { key: 'status',      label: 'Status',       tipe: 'status' }
      ]
    }
  };

  let jenisAktif = 'kebutuhan';
  let dataLaporan = [];

  function gantiJenis(jenis){
    jenisAktif = jenis;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.jenis === jenis));

    const pakaiTanggal = !!KONFIG[jenis].kolomTanggal;
    document.getElementById('grupMulai').style.display = pakaiTanggal ? '' : 'none';
    document.getElementById('grupSampai').style.display = pakaiTanggal ? '' : 'none';

    loadLaporan();
  }

  function pesanErrorRamah(error){
    if(!error) return 'Terjadi kesalahan yang tidak diketahui.';
    const msg = error.message || String(error);
    if(/row-level security|permission denied|RLS/i.test(msg)){
      return 'Akses ditolak oleh Row Level Security (RLS). (Detail: ' + msg + ')';
    }
    if(/relation .* does not exist|could not find the table/i.test(msg)){
      return 'Tabel belum ada atau nama tabel di KONFIG salah. (Detail: ' + msg + ')';
    }
    if(/column .* does not exist|Could not find the/i.test(msg)){
      return 'Ada kolom yang belum sesuai skema asli. Cek bagian KONFIG di kode. (Detail: ' + msg + ')';
    }
    return msg;
  }

  function renderHead(){
    const cfg = KONFIG[jenisAktif];
    const thead = document.getElementById('theadLaporan');
    thead.innerHTML = '<tr>' + cfg.kolom.map(k => `<th>${k.label}</th>`).join('') + '</tr>';
  }

  function fmtTanggal(iso){
    if(!iso) return '-';
    const d = new Date(iso);
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
  }

  function statusPill(val){
    const v = (val || '').toString().toLowerCase();
    let cls = 'muted';
    if(/terpenuhi|selesai|aman|berhasil|sukses/.test(v)) cls = 'ok';
    else if(/sebagian|menipis|proses|pending|menunggu|diproses/.test(v)) cls = 'warn';
    else if(/belum|habis|gagal|kosong/.test(v)) cls = 'bad';
    return `<span class="status-pill ${cls}">${val || '-'}</span>`;
  }

  function renderBody(){
    const cfg = KONFIG[jenisAktif];
    const tbody = document.getElementById('tbodyLaporan');

    if(dataLaporan.length === 0){
      tbody.innerHTML = `<tr><td colspan="${cfg.kolom.length}" class="empty-msg">Tidak ada data yang ditemukan.</td></tr>`;
      return;
    }

    tbody.innerHTML = '';
    dataLaporan.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = cfg.kolom.map(k => {
        const val = row[k.key];
        if(k.tipe === 'tanggal') return `<td>${fmtTanggal(val)}</td>`;
        if(k.tipe === 'status') return `<td>${statusPill(val)}</td>`;
        return `<td>${val ?? '-'}</td>`;
      }).join('');
      tbody.appendChild(tr);
    });
  }

  async function loadLaporan(){
    renderHead();
    const cfg = KONFIG[jenisAktif];
    const tbody = document.getElementById('tbodyLaporan');
    tbody.innerHTML = `<tr><td colspan="${cfg.kolom.length}" class="empty-msg">Memuat data...</td></tr>`;

    if(!db){
      tbody.innerHTML = `<tr><td colspan="${cfg.kolom.length}" class="empty-msg">Koneksi Supabase belum siap.</td></tr>`;
      return;
    }

    try {
      let query = db.from(cfg.table).select('*');

      if(cfg.kolomTanggal){
        const mulai = document.getElementById('fMulai').value;
        const sampai = document.getElementById('fSampai').value;
        if(mulai) query = query.gte(cfg.kolomTanggal, mulai);
        if(sampai) query = query.lte(cfg.kolomTanggal, sampai + 'T23:59:59');
        query = query.order(cfg.kolomTanggal, { ascending: false });
      }

      const { data, error } = await query;
      if(error){
        console.error(error);
        tbody.innerHTML = `<tr><td colspan="${cfg.kolom.length}" class="empty-msg">Gagal memuat data: ${pesanErrorRamah(error)}</td></tr>`;
        dataLaporan = [];
        return;
      }

      dataLaporan = data || [];
      renderBody();
    } catch (e) {
      console.error(e);
      tbody.innerHTML = `<tr><td colspan="${cfg.kolom.length}" class="empty-msg">Gagal memuat data: ${pesanErrorRamah(e)}</td></tr>`;
    }
  }

  function exportExcel(){
    if(dataLaporan.length === 0){ tampilkanToast('Tidak ada data untuk diekspor.', true); return; }
    const cfg = KONFIG[jenisAktif];
    const rows = dataLaporan.map(row => {
      const obj = {};
      cfg.kolom.forEach(k => {
        obj[k.label] = k.tipe === 'tanggal' ? fmtTanggal(row[k.key]) : (row[k.key] ?? '-');
      });
      return obj;
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, cfg.judul.substring(0, 31));
    XLSX.writeFile(wb, `Laporan-${cfg.judul.replace(/\s+/g,'-')}-${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  function exportPDF(){
    if(dataLaporan.length === 0){ tampilkanToast('Tidak ada data untuk diekspor.', true); return; }
    const cfg = KONFIG[jenisAktif];
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(14);
    doc.text(`Laporan ${cfg.judul} — Sigap-Farmasi`, 14, 16);
    doc.setFontSize(9);
    doc.text(`Diunduh: ${new Date().toLocaleString('id-ID')}`, 14, 22);

    const head = [cfg.kolom.map(k => k.label)];
    const body = dataLaporan.map(row => cfg.kolom.map(k =>
      k.tipe === 'tanggal' ? fmtTanggal(row[k.key]) : String(row[k.key] ?? '-')
    ));

    doc.autoTable({ head, body, startY: 28, styles: { fontSize: 8 }, headStyles: { fillColor: [232,163,61] } });
    doc.save(`Laporan-${cfg.judul.replace(/\s+/g,'-')}-${new Date().toISOString().slice(0,10)}.pdf`);
  }

  function tampilkanToast(msg, isError){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.style.display = 'block';
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(()=>{ t.style.display = 'none'; }, 6000);
  }

  function terapkanSesiUI(){
    let sesi = null;
    try{ sesi = JSON.parse(localStorage.getItem('sigapSesi') || 'null'); }catch(e){}
    if(!sesi){ window.location.href = 'login.html'; return; }
    const inisialSesi = (sesi.nama || '?').trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    document.querySelectorAll('.avatar').forEach(el => { el.textContent = inisialSesi; });
    if(sesi.peran !== 'Super Admin'){
      const menuAkun = document.getElementById('menuManajemenAkun');
      if(menuAkun) menuAkun.style.display = 'none';
    }
  }

  function logoutSistem(){
    const yakin = confirm('Yakin ingin keluar dari sistem?');
    if(!yakin) return;
    localStorage.removeItem('sigapSesi');
    window.location.href = 'login.html';
  }

  terapkanSesiUI();

  renderHead();
  loadLaporan();
</script>
</body>
</html>
