<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIPHABEN — Distribusi Obat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
  :root {
    --bg: #0b0f14;
    --sidebar: #0d1319;
    --card: #111823;
    --border: rgba(255,255,255,0.07);
    --text: #e2e8f0;
    --muted: #64748b;
    --green: #10b981;
    --green-dark: #059669;
    --green-soft: rgba(16,185,129,0.12);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
  }

  /* ===================== SIDEBAR ===================== */
  .sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
    overflow-y: auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 20px;
    border-bottom: 1px solid var(--border);
  }

  .brand-icon {
    width: 32px;
    height: 32px;
    background: var(--green);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
  }

  .brand span {
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    letter-spacing: 0.02em;
  }

  .nav-section {
    padding: 20px 12px 8px;
  }

  .nav-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding: 0 10px 8px;
    font-weight: 600;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    margin: 2px 0;
    border-radius: 8px;
    color: #94a3b8;
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.12s ease, color 0.12s ease;
  }

  .nav-item svg { flex-shrink: 0; }

  .nav-item:hover {
    background: rgba(255,255,255,0.03);
    color: #e2e8f0;
  }

  .nav-item.active {
    background: var(--green-soft);
    color: var(--green);
    border-left-color: var(--green);
    margin-left: -3px;
  }

  .sidebar-spacer { flex: 1; }

  /* ===================== TOPBAR ===================== */
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:hover { color: #fff; }

  .global-search {
    flex: 1;
    max-width: 480px;
    position: relative;
  }

  .global-search svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
  }

  .global-search input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px 11px 40px;
    font-size: 14px;
    color: var(--text);
    outline: none;
  }
  .global-search input:focus { border-color: rgba(16,185,129,0.4); }
  .global-search input::placeholder { color: var(--muted); }

  .topbar-spacer { flex: 1; }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--green);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
    cursor: pointer;
  }

  /* ===================== CONTENT ===================== */
  .content {
    padding: 32px;
    flex: 1;
  }

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }

  .page-header h1 {
    font-size: 24px;
    font-weight: 600;
    color: #fff;
    margin: 0;
  }

  .page-header p {
    color: rgba(16,185,129,0.85);
    font-size: 14px;
    margin: 4px 0 0;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--green);
    color: #fff;
    border: none;
    font-weight: 500;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-primary:hover { background: var(--green-dark); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .search-bar {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .search-input-wrap {
    position: relative;
    max-width: 380px;
  }

  .search-input-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
  }

  .search-input-wrap input {
    width: 100%;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 10px 12px 10px 36px;
    font-size: 14px;
    color: var(--text);
    outline: none;
  }
  .search-input-wrap input:focus { border-color: rgba(16,185,129,0.5); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  thead tr { border-bottom: 1px solid var(--border); }

  thead th {
    text-align: left;
    padding: 12px 20px;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    white-space: nowrap;
  }

  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }

  tbody td {
    padding: 14px 20px;
    color: var(--text);
    white-space: nowrap;
  }

  .mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; color: #cbd5e1; }
  .muted { color: var(--muted); }

  .empty-state {
    text-align: center;
    padding: 64px 20px;
    color: var(--muted);
  }

  .status-badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid;
    background: transparent;
    cursor: pointer;
    outline: none;
    font-family: inherit;
  }
  .status-badge option { background: var(--card); color: var(--text); }

  .status-Menunggu   { color: #fbbf24; border-color: rgba(251,191,36,0.3); background: rgba(251,191,36,0.1); }
  .status-Dikirim    { color: #38bdf8; border-color: rgba(56,189,248,0.3); background: rgba(56,189,248,0.1); }
  .status-Diterima   { color: #34d399; border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.1); }
  .status-Dibatalkan { color: #fb7185; border-color: rgba(251,113,133,0.3); background: rgba(251,113,133,0.1); }

  .action-link {
    color: var(--green);
    font-size: 12px;
    font-weight: 500;
    background: none;
    border: none;
    cursor: pointer;
  }
  .action-link:hover { color: #34d399; }

  /* ===================== MODAL ===================== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
  }

  .modal-header h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .close-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 4px;
  }
  .close-btn:hover { color: var(--text); }

  form { padding: 24px; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .field input, .field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    font-family: inherit;
  }
  .field input:focus, .field select:focus { border-color: rgba(16,185,129,0.5); }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 8px;
  }

  .btn-ghost {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    padding: 9px 16px;
    cursor: pointer;
  }
  .btn-ghost:hover { color: var(--text); }

  .error-box {
    color: #fb7185;
    font-size: 12px;
    background: rgba(251,113,133,0.1);
    border: 1px solid rgba(251,113,133,0.3);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 16px;
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===================== RESPONSIVE ===================== */
  @media (max-width: 900px) {
    .sidebar { position: fixed; left: -260px; z-index: 40; transition: left 0.2s ease; }
    .sidebar.open { left: 0; }
    .content { padding: 20px; }
    .topbar { padding: 14px 16px; }
  }

  @media (max-width: 640px) {
    .row-2 { grid-template-columns: 1fr; }
    .global-search { display: none; }
  }
</style>
</head>

<div class="main">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>

    <div class="global-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

<!-- ===================== MODAL KIRIM OBAT ===================== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        Kirim Obat
      </h2>

      </button>
    </div>

    <form id="kirimForm">
      <div id="formError"></div>

      <div class="field">
        <label>Nama Obat</label>
        <input type="text" id="f_obat" placeholder="mis. Paracetamol 500mg" required />
      </div>

      <div class="row-2">
        <div class="field">
          <label>Asal</label>
          <input type="text" id="f_asal" placeholder="Gudang Farmasi" required />
        </div>
        <div class="field">
          <label>Tujuan</label>
          <input type="text" id="f_tujuan" placeholder="Puskesmas..." required />
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label>Jumlah</label>
          <input type="number" id="f_jumlah" min="1" placeholder="0" required />
        </div>
        <div class="field">
          <label>Kurir</label>
          <input type="text" id="f_kurir" placeholder="Nama kurir" required />
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label>Tanggal Kirim</label>
          <input type="date" id="f_tanggal" required />
        </div>
        <div class="field">
          <label>Status</label>
          <select id="f_status">
            <option value="Menunggu">Menunggu</option>
            <option value="Dikirim">Dikirim</option>
            <option value="Diterima">Diterima</option>
            <option value="Dibatalkan">Dibatalkan</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-ghost" id="btnCancel">Batal</button>
        <button type="submit" class="btn-primary" id="btnSubmit">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script>
  // =========================================================
  // KONFIGURASI SUPABASE — ganti dengan project kamu sendiri
  // Ambil dari Supabase Dashboard > Project Settings > API
  // =========================================================
  const SUPABASE_URL = "https://xxxxxxxxxxxx.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJI...isi-anon-key-kamu";

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const tableBody = document.getElementById("tableBody");
  const searchInput = document.getElementById("searchInput");
  const modalOverlay = document.getElementById("modalOverlay");
  const kirimForm = document.getElementById("kirimForm");
  const formError = document.getElementById("formError");
  const btnSubmit = document.getElementById("btnSubmit");

  let allRows = [];

  document.getElementById("f_tanggal").value = new Date().toISOString().slice(0, 10);

  document.getElementById("btnToggleSidebar").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("open");
  });

  function formatTanggal(dateStr) {
    if (!dateStr) return "-";
    const d = new Date(dateStr);
    return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
  }

  function renderRows(rows) {
    if (!rows.length) {
      tableBody.innerHTML = `<tr><td colspan="9" class="empty-state">Tidak ada data yang ditemukan.</td></tr>`;
      return;
    }

    tableBody.innerHTML = rows.map(row => `
      <tr>
        <td class="mono">${row.nomor_resi}</td>
        <td>${row.obat}</td>
        <td class="muted">${row.asal}</td>
        <td class="muted">${row.tujuan}</td>
        <td>${Number(row.jumlah).toLocaleString("id-ID")}</td>
        <td class="muted">${row.kurir}</td>
        <td class="muted">${formatTanggal(row.tanggal_kirim)}</td>
        <td>
          <select class="status-badge status-${row.status}" data-id="${row.id}">
            ${["Menunggu","Dikirim","Diterima","Dibatalkan"].map(s =>
              `<option value="${s}" ${s === row.status ? "selected" : ""}>${s}</option>`
            ).join("")}
          </select>
        </td>
        <td><button class="action-link">Detail</button></td>
      </tr>
    `).join("");

    tableBody.querySelectorAll(".status-badge").forEach(select => {
      select.addEventListener("change", async (e) => {
        const id = e.target.dataset.id;
        const status = e.target.value;
        e.target.className = "status-badge status-" + status;
        const { error } = await db.from("distribusi_obat").update({ status }).eq("id", id);
        if (error) alert("Gagal update status: " + error.message);
      });
    });
  }

  async function fetchData() {
    const { data: rows, error } = await db
      .from("distribusi_obat")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      tableBody.innerHTML = `<tr><td colspan="9" class="empty-state">Gagal memuat data: ${error.message}</td></tr>`;
      return;
    }

    allRows = rows || [];
    applyFilter();
  }

  function applyFilter() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = !q
      ? allRows
      : allRows.filter(row =>
          [row.nomor_resi, row.obat, row.asal, row.tujuan, row.kurir]
            .filter(Boolean)
            .some(field => field.toLowerCase().includes(q))
        );
    renderRows(filtered);
  }

  searchInput.addEventListener("input", applyFilter);

  document.getElementById("btnOpenModal").addEventListener("click", () => {
    modalOverlay.classList.add("open");
  });
  function closeModal() {
    modalOverlay.classList.remove("open");
    formError.innerHTML = "";
  }
  document.getElementById("btnCloseModal").addEventListener("click", closeModal);
  document.getElementById("btnCancel").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  kirimForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    formError.innerHTML = "";
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = `<span class="spinner"></span>Menyimpan...`;

    const { data: resi, error: resiErr } = await db.rpc("generate_nomor_resi");
    if (resiErr) {
      formError.innerHTML = `<div class="error-box">${resiErr.message}</div>`;
      btnSubmit.disabled = false;
      btnSubmit.textContent = "Simpan";
      return;
    }

    const payload = {
      nomor_resi: resi,
      obat: document.getElementById("f_obat").value,
      asal: document.getElementById("f_asal").value,
      tujuan: document.getElementById("f_tujuan").value,
      jumlah: Number(document.getElementById("f_jumlah").value),
      kurir: document.getElementById("f_kurir").value,
      tanggal_kirim: document.getElementById("f_tanggal").value,
      status: document.getElementById("f_status").value,
    };

    const { error } = await db.from("distribusi_obat").insert(payload);

    btnSubmit.disabled = false;
    btnSubmit.textContent = "Simpan";

    if (error) {
      formError.innerHTML = `<div class="error-box">${error.message}</div>`;
      return;
    }

    kirimForm.reset();
    document.getElementById("f_tanggal").value = new Date().toISOString().slice(0, 10);
    closeModal();
    fetchData();
  });

  db.channel("distribusi_obat_changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "distribusi_obat" }, fetchData)
    .subscribe();

  fetchData();
</script>

</body>
</html>
